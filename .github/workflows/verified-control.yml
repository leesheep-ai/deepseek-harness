name: Verified Control

on:
  push:
    branches:
      - feature/verified-control
    paths:
      - 'packages/guard/verified-control/**'
      - 'packages/bundle/verified-control/**'
      - '.github/workflows/verified-control.yml'
  pull_request:
    paths:
      - 'packages/guard/verified-control/**'
      - 'packages/bundle/verified-control/**'
      - '.github/workflows/verified-control.yml'

permissions:
  contents: write

jobs:
  verified-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Sync verified-control monorepo metadata
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          pnpm run gen-tsconfig-paths
          python - <<'PY'
          from pathlib import Path

          path = Path('tsconfig.host.json')
          text = path.read_text()
          insertions = [
              ('    { "path": "./packages/guard/timeout-policy" },', '    { "path": "./packages/guard/verified-control" },'),
              ('    { "path": "./packages/bundle/base" },', '    { "path": "./packages/bundle/verified-control" },'),
          ]
          for anchor, entry in insertions:
              if entry not in text:
                  if anchor not in text:
                      raise SystemExit(f'missing tsconfig.host.json anchor: {anchor}')
                  text = text.replace(anchor, f'{anchor}\n{entry}', 1)
          path.write_text(text)
          PY
          if ! git diff --quiet -- tsconfig.base.json tsconfig.host.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tsconfig.base.json tsconfig.host.json
            git commit -m 'chore(verified-control): sync monorepo metadata'
            git push
          fi
      - name: Typecheck verified-control projects
        run: pnpm exec tsc -b packages/guard/verified-control packages/bundle/verified-control --pretty false
      - name: Run verified-control tests
        run: pnpm exec vitest run packages/guard/verified-control/tests packages/bundle/verified-control/tests
      - name: Run package contract gates
        run: |
          pnpm run verify-package-paths
          pnpm run verify-dsh-package-licenses
          pnpm run verify-package-invariants
          pnpm run verify-package-readme-model-experience
          pnpm run verify-translation-pairing
      - name: Persist generated workspace lock importer
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add pnpm-lock.yaml
            git commit -m 'chore(verified-control): sync pnpm lockfile'
            git push
          fi
